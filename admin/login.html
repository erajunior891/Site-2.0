<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в панель управления — K.K. Tour</title>
  <link rel="icon" type="image/jpeg" href="../assets/images/favicon.jpg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F2FBF6',
              500: '#10B981',
              600: '#059669',
              700: '#047857',
              900: '#064E3B',
              dark: '#0B291F'
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

  <!-- Background decorative glows -->
  <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-teal-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10">
    
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-3 group mb-3">
        <img src="../assets/images/logo.jpg" alt="K.K. Tour" class="w-12 h-12 rounded-2xl object-cover shadow-lg border border-emerald-500/30 group-hover:scale-105 transition-transform">
        <div class="text-left">
          <span class="text-2xl font-bold font-serif tracking-tight text-white block">K.K. <span class="text-emerald-400">Tour</span></span>
          <span class="text-[10px] tracking-widest uppercase font-semibold text-emerald-400/80">Admin Panel</span>
        </div>
      </a>
      <h1 class="text-2xl font-bold text-white">Вход в систему управления</h1>
      <p class="text-sm text-slate-400 mt-1">Доступ только для администраторов и редакторов K.K. Tour</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl shadow-emerald-950/40">
      
      <!-- Error Message Banner -->
      <div id="loginError" class="hidden mb-6 bg-rose-500/10 border border-rose-500/30 rounded-2xl p-4 text-xs font-semibold text-rose-300 flex items-start gap-2.5">
        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
        <span id="loginErrorText">Ошибка авторизации</span>
      </div>

      <form id="adminLoginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Email адрес</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-4 top-3.5 pointer-events-none"></i>
            <input 
              type="email" 
              id="adminEmail" 
              required 
              placeholder="admin@kktour.kz"
              class="w-full bg-slate-800/80 border border-slate-700 focus:border-emerald-500 rounded-2xl py-3 pl-11 pr-4 text-sm font-semibold text-white placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/20 focus:outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Пароль</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-4 top-3.5 pointer-events-none"></i>
            <input 
              type="password" 
              id="adminPassword" 
              required 
              placeholder="••••••••"
              class="w-full bg-slate-800/80 border border-slate-700 focus:border-emerald-500 rounded-2xl py-3 pl-11 pr-4 text-sm font-semibold text-white placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/20 focus:outline-none transition-all">
          </div>
        </div>

        <button 
          type="submit" 
          id="btnLoginSubmit"
          class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-emerald-600/25 hover:shadow-emerald-600/40 transition-all flex items-center justify-center gap-2 text-sm cursor-pointer disabled:opacity-50">
          <span>Войти в панель</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-800/80 text-center">
        <a href="../index.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-emerald-400 transition-colors">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Вернуться на публичный сайт K.K. Tour</span>
        </a>
      </div>

    </div>

    <!-- Security Info Note -->
    <p class="text-center text-xs text-slate-600 mt-6 flex items-center justify-center gap-1.5">
      <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500"></i>
      <span>Защищено Supabase Auth & PostgreSQL Row Level Security (RLS)</span>
    </p>

  </div>

  <!-- Supabase Scripts & Admin API -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/admin-api.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.lucide) lucide.createIcons();

      // Check if already authenticated
      if (window.adminApi) {
        const profile = await window.adminApi.getCurrentAdminProfile();
        if (profile && ['admin', 'editor'].includes(profile.role)) {
          window.location.href = 'index.html';
          return;
        }
      }

      const form = document.getElementById('adminLoginForm');
      const emailInput = document.getElementById('adminEmail');
      const passInput = document.getElementById('adminPassword');
      const btnSubmit = document.getElementById('btnLoginSubmit');
      const errBanner = document.getElementById('loginError');
      const errText = document.getElementById('loginErrorText');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBanner.classList.add('hidden');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<span class="animate-spin mr-2">⭮</span> Входим...`;

        try {
          const email = emailInput.value.trim();
          const pass = passInput.value;
          await window.adminApi.adminLogin(email, pass);
          window.location.href = 'index.html';
        } catch (err) {
          errBanner.classList.remove('hidden');
          errText.textContent = err.message || 'Неверный email или пароль.';
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Войти в панель</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          if (window.lucide) lucide.createIcons();
        }
      });
    });
  </script>
</body>
</html>
